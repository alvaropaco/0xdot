[package]
name = "rakazo-desktop"
version = "0.3.7"
description = "0xdot desktop runtime"
authors = ["0xdot"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = { version = "2.5.3", features = ["deep-link"] }
tauri-plugin-updater = "2"
# rust-ini 0.21.2+ adds non-defaulted ParseOption fields that break
# tauri-plugin-deep-link 2.6.x's Linux desktop-file parsing; hold the
# pre-breakage patch until a stable plugin release catches up.
rust-ini = "=0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
# The rcs pin each other: tauri-specta requires exactly this specta, whose
# TypeScript backend is only 0.0.13 (0.0.14 already targets the next rc).
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["time", "sync"] }
rakazo-core = { path = "../../../crates/rakazo-core" }
rakazo-host = { path = "../../../crates/rakazo-host" }
rakazo-model-openai = { path = "../../../crates/rakazo-model-openai" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
