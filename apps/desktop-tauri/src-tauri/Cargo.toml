[package]
name = "rakazo-desktop"
version = "0.3.3"
description = "0xdot desktop runtime"
authors = ["0xdot"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.6.1"
tauri-plugin-single-instance = { version = "2.5.3", features = ["deep-link"] }
tauri-plugin-updater = "2"
# rust-ini 0.21.2+ adds non-defaulted ParseOption fields that break
# tauri-plugin-deep-link 2.6.x's Linux desktop-file parsing; hold the
# pre-breakage patch until a stable plugin release catches up.
rust-ini = "=0.21.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tokio = { version = "1", features = ["time"] }
rakazo-core = { path = "../../../crates/rakazo-core" }
rakazo-host = { path = "../../../crates/rakazo-host" }
rakazo-model-openai = { path = "../../../crates/rakazo-model-openai" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
