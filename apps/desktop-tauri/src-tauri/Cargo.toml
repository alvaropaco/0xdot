[package]
name = "rakazo-desktop"
version = "0.3.3"
description = "Rakazo desktop runtime"
authors = ["Rakazo"]
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["time"] }
rakazo-core = { path = "../../../crates/rakazo-core" }
rakazo-host = { path = "../../../crates/rakazo-host" }
rakazo-model-openai = { path = "../../../crates/rakazo-model-openai" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
