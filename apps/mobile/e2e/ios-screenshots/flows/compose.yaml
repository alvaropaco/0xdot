appId: com.rakazo.app
name: Compose
---
- runFlow:
    file: ../subflows/launch-app.yaml
- openLink: "rakazo:///new-space"
- extendedWaitUntil:
    visible: "Customer support|Create space"
    timeout: 15000
- takeScreenshot: 02-new-space
- tapOn: "Cancel"
- openLink: "rakazo:///new-group"
- extendedWaitUntil:
    visible: "Search bots"
    timeout: 15000
- tapOn: "Researcher"
- tapOn: "Writer"
- takeScreenshot: 03-new-group
- tapOn: "Next"
- assertVisible: "Skip"
- takeScreenshot: 04-new-group-name
- openLink: "rakazo:///"
