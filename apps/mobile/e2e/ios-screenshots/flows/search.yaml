appId: com.rakazo.app
name: Search
---
- runFlow:
    file: ../subflows/launch-app.yaml
- tapOn:
    id: "home-search-button"
    optional: true
- runFlow:
    when:
      notVisible:
        id: "search-sheet-field"
    commands:
      - tapOn: "Search"
- tapOn:
    id: "search-sheet-field"
- takeScreenshot: 01-search-empty
- inputText: "zzzz-no-such-fixture"
- extendedWaitUntil:
    visible: ".*No results.*"
    timeout: 15000
- takeScreenshot: 02-search-none
- tapOn:
    text: "Clear text"
    optional: true
- eraseText: 40
- inputText: "marigold"
- extendedWaitUntil:
    visible: ".*marigold checklist.*"
    timeout: 15000
- takeScreenshot: 03-search-results

- tapOn:
    id: "search-sheet-close"
