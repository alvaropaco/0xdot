appId: com.rakazo.app
name: Rakazo mobile smoke
---
- launchApp:
    clearState: true

- runFlow: helpers/setup.yaml

- tapOn: "Create"
- tapOn: "New bot"

- extendedWaitUntil:
    visible: "Message…"
    timeout: 30000
- tapOn: "Message…"
- inputText: ${RAKAZO_E2E_MESSAGE}
- pressKey: Enter
- assertVisible: ${RAKAZO_E2E_MESSAGE}

- tapOn: "Bot actions"
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "Open computer"
    timeout: 30000
- tapOn: "Open computer"
- extendedWaitUntil:
    visible: "You have control"
    timeout: 90000
- tapOn: "Close computer"
- tapOn: "Release"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 30000
