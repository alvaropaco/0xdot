name: Rust Core

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/desktop-tauri/src-tauri/**'
      - '.github/workflows/rust-core.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/desktop-tauri/src-tauri/**'
      - '.github/workflows/rust-core.yml'

permissions:
  contents: read

jobs:
  check:
    name: Rust workspace
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  macos:
    name: macOS host adapter
    runs-on: macos-latest
    defaults:
      run:
        working-directory: crates
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.90.0'
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo test -p rakazo-host --all-targets
