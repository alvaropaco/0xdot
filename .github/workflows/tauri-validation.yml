name: tauri-validation

on:
  pull_request:
    paths:
      - "apps/desktop-tauri/**"
      - "apps/web/**"
      - "packages/desktop-api/**"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/tauri-validation.yml"
  push:
    branches: [main]
    paths:
      - "apps/desktop-tauri/**"
      - "apps/web/**"
      - "packages/desktop-api/**"
      - "crates/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/tauri-validation.yml"

permissions:
  contents: read

jobs:
  rust:
    name: Rust core
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check
      - run: cargo check --manifest-path crates/Cargo.toml
      - run: cargo test --manifest-path crates/Cargo.toml
      - run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings

  desktop:
    name: Tauri ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm rust:check
      - run: pnpm build:tauri
        env:
          RAKAZO_ALLOW_DEV_SECRETS: "1"
