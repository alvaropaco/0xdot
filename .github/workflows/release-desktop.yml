name: release-desktop-legacy

# Electron releases are retired. Tauri is the native desktop release channel.
# This workflow remains as a tombstone so historical references do not silently
# publish Electron artifacts.
on:
  workflow_dispatch:

jobs:
  retired:
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "Electron release workflow retired; use release-tauri.yml"
